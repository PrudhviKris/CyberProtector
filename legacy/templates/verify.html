<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Text</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('{{ url_for('static', filename='Verifypage.jpg') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            margin: 100px auto;
            width: 50%;
            border-radius: 15px;
        }
        textarea {
            width: 90%;
            height: 150px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            resize: none;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #4CAF50; /* Green button */
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
            transition: 0.3s;
        }
        h1 {
            margin-bottom: 20px;
        }
        .prediction {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: yellow;
        }
        .back-link {
            margin-top: 30px;
            display: inline-block;
            color: #00ffff;
            text-decoration: none;
            font-size: 18px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enter the Text</h1>
        <form method="post">
            <textarea name="text" placeholder="Type here..."></textarea><br>
            <button type="submit">Verify Text</button>
        </form>

        {% if prediction %}
            <div class="prediction">
                {{ prediction }}
            </div>
        {% endif %}

        <br><br>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
