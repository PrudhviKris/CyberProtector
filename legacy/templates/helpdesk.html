<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Help Desk</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('{{ url_for('static', filename='HelpDesk.png') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            margin: 100px auto;
            width: 50%;
            border-radius: 15px;
        }
        input[type="email"], textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
        }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #ff9800; /* Orange button */
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e68900;
            transform: scale(1.05);
            transition: 0.3s;
        }
        h1 {
            margin-bottom: 20px;
        }
        .message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: lightgreen;
        }
        .back-link {
            margin-top: 30px;
            display: inline-block;
            color: #00ffff;
            text-decoration: none;
            font-size: 18px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Help Desk</h1>
        <form method="post">
            <input type="email" name="email" placeholder="Enter Your Email" required><br>
            <textarea name="query" rows="5" placeholder="Enter your query here..." required></textarea><br>
            <button type="submit">Submit Query</button>
        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <br><br>
        <a href="/" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
