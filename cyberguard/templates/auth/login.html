{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:24px auto">
  <h1>Sign in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="identifier">Username or email</label><input id="identifier" type="text" name="identifier" value="{{ identifier or '' }}" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required></div>
    <div class="field row"><input id="remember" type="checkbox" name="remember" value="1"><label for="remember" style="margin:0;font-weight:500">Remember me</label></div>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
  </form>
  <p class="muted small" style="margin-top:14px">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
